<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Ascendia - Portal do Reino</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Pixel Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            retroBg: '#090d13',
            retroCard: '#111722',
            retroInput: '#080c12',
            goldLight: '#ffe596',
            goldMid: '#f2ca50',
            goldDark: '#997312',
            goldBorder: '#5a4a28',
            cyanGlow: '#00e1d9',
            slateDark: '#1c2533',
            slateBorder: '#2e3a4e'
          },
          fontFamily: {
            pixel: ['"Press Start 2P"', 'monospace'],
            retroText: ['"VT323"', 'monospace']
          }
        }
      }
    }
  </script>
<!-- Base Custom Pixel Styling -->
<style data-purpose="pixel-effects">
    /* Scanlines and pixel screen feel */
    body {
      background-color: #090d13;
      background-image: 
        linear-gradient(rgba(18, 23, 32, 0.9) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 23, 32, 0.9) 1px, transparent 1px);
      background-size: 16px 16px;
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
    }

    /* 16-Bit Beveled Button Style */
    .pixel-btn-gold {
      background: linear-gradient(180deg, #fce07a 0%, #f2ca50 50%, #c49925 100%);
      box-shadow: 
        inset -3px -3px 0px 0px #825f0a,
        inset 3px 3px 0px 0px #fff4a3,
        0 4px 0 0 #3e2d03;
      transition: transform 0.05s, box-shadow 0.05s;
    }
    .pixel-btn-gold:active {
      transform: translateY(3px);
      box-shadow: 
        inset -2px -2px 0px 0px #825f0a,
        inset 2px 2px 0px 0px #fff4a3,
        0 1px 0 0 #3e2d03;
    }

    /* Secondary Pixel Button */
    .pixel-btn-secondary {
      background-color: #121926;
      box-shadow: 
        inset -2px -2px 0px 0px #090d14,
        inset 2px 2px 0px 0px #2a374f,
        0 3px 0 0 #07090e;
      border: 2px solid #2e3d54;
    }
    .pixel-btn-secondary:active {
      transform: translateY(2px);
      box-shadow: 
        inset -1px -1px 0px 0px #090d14,
        inset 1px 1px 0px 0px #2a374f,
        0 1px 0 0 #07090e;
    }

    /* Pixel Box Inset for Inputs */
    .pixel-input {
      box-shadow: 
        inset 3px 3px 0px 0px #000000,
        inset -1px -1px 0px 0px #222d3d;
      border: 2px solid #364459;
    }
    .pixel-input:focus {
      outline: none;
      border-color: #f2ca50;
      box-shadow: 
        inset 3px 3px 0px 0px #000000,
        0 0 0 1px #f2ca50;
    }

    /* Pixel Checkbox */
    .pixel-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #080c12;
      border: 2px solid #5a4a28;
      box-shadow: inset 2px 2px 0px #000;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }
    .pixel-checkbox:checked {
      background: #f2ca50;
      border-color: #ffe596;
      box-shadow: inset 2px 2px 0px #fff;
    }
    .pixel-checkbox:checked::after {
      content: '✓';
      position: absolute;
      top: -4px;
      left: 1px;
      font-size: 14px;
      color: #0d1117;
      font-weight: bold;
      font-family: monospace;
    }

    /* Scanline screen overlay effect */
    .scanlines::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 999;
      pointer-events: none;
      opacity: 0.6;
    }
  </style>
</head>
<body class="min-h-screen bg-[#090d13] text-slate-200 scanlines selection:bg-goldMid selection:text-black">
<div class="max-w-md mx-auto relative bg-[#121720] shadow-2xl min-h-screen flex flex-col justify-between items-center border-x-2 border-[#5a4a28] px-4 py-6">
<!-- BEGIN: TopBranding -->
<header class="w-full max-w-sm flex flex-col items-center pt-2 pb-4" data-purpose="auth-header">
<!-- Logo Frame with Pixel Corners -->
<div class="relative p-2.5 bg-[#0e141d] border-2 border-[#5a4a28] shadow-[0_0_15px_rgba(242,202,80,0.15)] mb-3" data-purpose="crest-container">
<!-- Pixel Corner Accents -->
<span class="absolute -top-1 -left-1 w-2 h-2 bg-goldMid"></span>
<span class="absolute -top-1 -right-1 w-2 h-2 bg-goldMid"></span>
<span class="absolute -bottom-1 -left-1 w-2 h-2 bg-goldMid"></span>
<span class="absolute -bottom-1 -right-1 w-2 h-2 bg-goldMid"></span>
<!-- 16-Bit Crystal Crest Image -->
<img alt="Brasão de Ascendia" class="w-14 h-14 object-contain" src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='128' height='128' shape-rendering='crispEdges'&gt;&lt;rect width='64' height='64' fill='%230d1117'/&gt;&lt;rect x='28' y='4' width='8' height='4' fill='%23ffeaa7'/&gt;&lt;rect x='24' y='8' width='4' height='4' fill='%23d4af37'/&gt;&lt;rect x='36' y='8' width='4' height='4' fill='%23d4af37'/&gt;&lt;rect x='20' y='12' width='4' height='8' fill='%23d4af37'/&gt;&lt;rect x='40' y='12' width='4' height='8' fill='%23d4af37'/&gt;&lt;rect x='16' y='20' width='4' height='8' fill='%23ffeaa7'/&gt;&lt;rect x='44' y='20' width='4' height='8' fill='%23ffeaa7'/&gt;&lt;rect x='12' y='28' width='4' height='8' fill='%23997312'/&gt;&lt;rect x='48' y='28' width='4' height='8' fill='%23997312'/&gt;&lt;rect x='16' y='36' width='4' height='8' fill='%23d4af37'/&gt;&lt;rect x='44' y='36' width='4' height='8' fill='%23d4af37'/&gt;&lt;rect x='20' y='44' width='4' height='8' fill='%23997312'/&gt;&lt;rect x='40' y='44' width='4' height='8' fill='%23997312'/&gt;&lt;rect x='24' y='52' width='4' height='4' fill='%23d4af37'/&gt;&lt;rect x='36' y='52' width='4' height='4' fill='%23d4af37'/&gt;&lt;rect x='28' y='56' width='8' height='4' fill='%23ffeaa7'/&gt;&lt;rect x='28' y='12' width='8' height='8' fill='%2378ffd6'/&gt;&lt;rect x='24' y='20' width='16' height='8' fill='%2300e1d9'/&gt;&lt;rect x='20' y='28' width='24' height='8' fill='%2300b4d8'/&gt;&lt;rect x='28' y='24' width='8' height='12' fill='%23ffffff'/&gt;&lt;rect x='24' y='36' width='16' height='8' fill='%230077b6'/&gt;&lt;rect x='28' y='44' width='8' height='8' fill='%23023e8a'/&gt;&lt;rect x='4' y='28' width='8' height='4' fill='%23ffeaa7'/&gt;&lt;rect x='8' y='24' width='4' height='4' fill='%23d4af37'/&gt;&lt;rect x='52' y='28' width='8' height='4' fill='%23ffeaa7'/&gt;&lt;rect x='52' y='24' width='4' height='4' fill='%23d4af37'/&gt;&lt;/svg&gt;"/>
</div>
<!-- Title with Gold Pixel Glow -->
<h1 class="text-2xl sm:text-3xl text-goldMid tracking-[0.18em] uppercase drop-shadow-[0_3px_0px_#5a4a28] font-bold text-center mb-2">
      ASCENDIA
    </h1>
<!-- Subtitle Banner -->
<div class="border border-[#3d3119] bg-[#111722]/80 px-3 py-1 flex items-center gap-2">
<span class="text-[10px] text-goldDark">⚔</span>
<p class="text-[9px] text-[#dac482] tracking-wider uppercase font-pixel text-center">
        Forje sua lenda com disciplina
      </p>
<span class="text-[10px] text-goldDark">⚔</span>
</div>
</header>
<!-- END: TopBranding -->
<!-- BEGIN: AuthCentralCard -->
<main class="w-full max-w-sm my-auto" data-purpose="auth-form-card">
<div class="relative bg-retroCard border-2 border-goldBorder p-5 sm:p-6 shadow-[0_8px_30px_rgba(0,0,0,0.85)]">
<!-- Four Pixel Corners -->
<div class="absolute -top-1.5 -left-1.5 w-3 h-3 bg-goldMid border border-[#3e2d03]"></div>
<div class="absolute -top-1.5 -right-1.5 w-3 h-3 bg-goldMid border border-[#3e2d03]"></div>
<div class="absolute -bottom-1.5 -left-1.5 w-3 h-3 bg-goldMid border border-[#3e2d03]"></div>
<div class="absolute -bottom-1.5 -right-1.5 w-3 h-3 bg-goldMid border border-[#3e2d03]"></div>
<form action="create_hero.html" class="space-y-4" data-purpose="login-form" method="GET" novalidate>
<!-- Field 1: Hero Name / Email -->
<div class="space-y-1.5">
<label class="block text-[10px] text-goldLight tracking-wider flex items-center gap-1.5">
<span class="text-goldMid text-[8px]">▶</span>
<span>NOME DO HERÓI / E-MAIL</span>
</label>
<div class="relative flex items-center">
<span class="absolute left-3 text-goldDark text-xs pointer-events-none select-none font-bold">»</span>
<input class="pixel-input w-full bg-retroInput text-white pl-8 pr-3 py-3 text-[11px] placeholder:text-slate-600 font-pixel tracking-wide focus:bg-[#0c121c]" placeholder="NOME DO HERÓI OU E-MAIL" required="" type="text"/>
</div>
</div>
<!-- Field 2: Passphrase Rune -->
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="block text-[10px] text-goldLight tracking-wider flex items-center gap-1.5">
<span class="text-goldMid text-[8px]">▶</span>
<span>RUNAS DA SENHA</span>
</label>
<a class="text-[9px] text-cyanGlow/80 hover:text-cyanGlow hover:underline tracking-tight transition-colors" href="#forgot">
              ESQUECEU A SENHA?
            </a>
</div>
<div class="relative flex items-center">
<span class="absolute left-3 text-goldDark text-xs pointer-events-none select-none font-bold">»</span>
<input class="pixel-input w-full bg-retroInput text-white pl-8 pr-3 py-3 text-[12px] placeholder:text-slate-600 font-pixel tracking-widest focus:bg-[#0c121c]" placeholder="••••••••••••" required="" type="password"/>
</div>
</div>
<!-- Field 3: Honor Oath Checkbox -->
<div class="pt-1 pb-1">
<label class="flex items-start gap-3 cursor-pointer group select-none">
<input checked="" class="pixel-checkbox mt-0.5" type="checkbox"/>
<span class="text-[9px] text-slate-300 leading-relaxed font-pixel group-hover:text-goldLight transition-colors">
              Assinar o pacto diário de disciplina
            </span>
</label>
</div>
<!-- Field 4: Primary Login CTA Button -->
<div class="pt-2">
<button class="pixel-btn-gold w-full py-3.5 px-4 text-[#1a1403] font-bold text-xs tracking-wider flex items-center justify-center gap-2" type="submit">
<span>⚔</span>
<span>ENTRAR NO REINO</span>
<span>⚔</span>
</button>
</div>
<!-- Secondary Divider -->
<div class="relative flex py-2 items-center justify-center">
<div class="flex-grow border-t border-dashed border-[#2b374a]"></div>
<span class="flex-shrink mx-2 text-[8px] text-slate-500 uppercase tracking-widest">
            OU INVOQUE POR
          </span>
<div class="flex-grow border-t border-dashed border-[#2b374a]"></div>
</div>
<!-- Field 5: OAuth Pixel Buttons -->
<div class="grid grid-cols-2 gap-3" data-purpose="social-auth-buttons">
<!-- Google -->
<button class="pixel-btn-secondary py-2.5 px-3 flex items-center justify-center gap-2 text-slate-300 hover:text-white transition-colors" type="button">
<svg class="w-3.5 h-3.5 fill-current text-goldLight" viewbox="0 0 24 24">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"></path>
</svg>
<span class="text-[9px] font-pixel">GOOGLE</span>
</button>
<!-- Apple -->
<button class="pixel-btn-secondary py-2.5 px-3 flex items-center justify-center gap-2 text-slate-300 hover:text-white transition-colors" type="button">
<svg class="w-3.5 h-3.5 fill-current text-cyanGlow" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.65-.79 1.1-1.9 0.98-3.01-1 .04-2.19.67-2.88 1.48-.61.71-1.14 1.84-1 2.93 1.12.09 2.25-.59 2.9-1.4z"></path>
</svg>
<span class="text-[9px] font-pixel">APPLE</span>
</button>
</div>
</form>
</div>
</main>
<!-- END: AuthCentralCard -->
<!-- BEGIN: ServerFooter -->
<footer class="w-full max-w-sm pt-4 pb-2" data-purpose="server-status-footer">
<div class="border border-[#232d3d] bg-[#0c1118]/90 py-2.5 px-3 text-center flex items-center justify-center gap-2">
<span class="inline-block w-2 h-2 bg-cyanGlow shadow-[0_0_6px_#00e1d9] animate-pulse"></span>
<p class="text-[8px] text-slate-400 font-pixel tracking-wide">
        SERVIDOR DO REINO: <span class="text-goldMid">CIDADELA DE AETHELGARD</span> <span class="text-slate-500">[v2.4]</span>
</p>
</div>
</footer>
<!-- END: ServerFooter -->
</div>
</body></html>
